spring.application.name=copilot-app

# Server (applies to all profiles)
server.port=9090

# Enable HTTPS on the same port using a PKCS12 keystore (self-signed example)
# Create the keystore at C:\keystore\keystore.p12 (example keytool command below)
server.ssl.enabled=true
server.ssl.key-store=file:C:/keystore/keystore.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=myalias

# NOTE: H2 and in-memory datasource settings are in application-dev.properties
# to enable them at runtime use: --spring.profiles.active=dev

# Quick test (PowerShell):
# curl.exe -vk https://localhost:9090/    # -k accepts self-signed certs
# curl.exe -v http://localhost:9090/      # plain HTTP (will fail if port is TLS-only)
